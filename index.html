<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Match-3 Quest</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        h1 { margin: 4px 0; font-size: 1.3rem; text-align: center; }
        .game-container {
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.1);
            user-select: none;
            -webkit-user-select: none;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 8px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            background: #020617;
            padding: 6px;
            border-radius: 12px;
            aspect-ratio: 1;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .cell {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            position: relative;
            font-size: 1.2rem;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .cell.dragging { transform: scale(1.15); z-index: 10; filter: brightness(1.2); }
        
        .piece-0 { background: linear-gradient(135deg, #f87171, #dc2626); border-radius: 8px; box-shadow: 0 4px 10px rgba(220,38,38,0.4); } 
        .piece-1 { background: linear-gradient(135deg, #38bdf8, #0284c7); border-radius: 50%; box-shadow: 0 4px 10px rgba(2,132,199,0.4); } 
        .piece-2 { background: linear-gradient(135deg, #4ade80, #16a34a); clip-path: polygon(50% 10%, 5% 90%, 95% 90%); border-radius: 0; box-shadow: 0 4px 10px rgba(22,163,74,0.4); } 
        .piece-3 { background: linear-gradient(135deg, #facc15, #ca8a04); clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%); box-shadow: 0 4px 10px rgba(202,138,4,0.4); } 
        .piece-4 { background: linear-gradient(135deg, #c084fc, #9333ea); border-radius: 35%; box-shadow: 0 4px 10px rgba(147,51,234,0.4); }
        
        .special-drone { background: radial-gradient(circle, #7dd3fc 0%, #0369a1 100%); border-radius: 6px; border: 2px solid #fff; animation: pulse-glow 1.5s infinite; }
        .special-tnt { background: radial-gradient(circle, #fdba74 0%, #c2410c 100%); border-radius: 8px; border: 2px solid #facc15; }
        .special-prism { background: radial-gradient(circle, #ffffff 0%, #f472b6 100%, #db2777 100%); border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 12px #ec4899; }

        @keyframes pulse-glow {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .status-msg {
            margin-top: 6px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            min-height: 1.1em;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Match-3 Quest</h1>
    <div class="hud">
        <span id="level-display">Level: 1</span>
        <span id="score-display">Score: 0 / 1000</span>
        <span id="moves-display">Moves: 25</span>
    </div>
    <div class="board" id="board-grid"></div>
    <div class="status-msg" id="status-msg">Drag adjacent pieces to swap & match!</div>
    <div class="controls">
        <button onclick="initGame()">Restart Level</button>
        <button onclick="shuffleBoard()">Shuffle Board</button>
    </div>
</div>

<script>
    const BOARD_SIZE = 8;
    const NUM_COLORS = 5;
    let board = [];
    let score = 0;
    let level = 1;
    let targetScore = 1000;
    let moves = 25;
    let isProcessing = false;
    let dragStart = null;

    function randomColor() {
        return Math.floor(Math.random() * NUM_COLORS);
    }

    function initGame() {
        score = 0;
        moves = 25;
        isProcessing = false;
        
        do {
            board = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                let row = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    row.push({ color: randomColor(), special: null });
                }
                board.push(row);
            }
        } while (detectAllMatches().length > 0);

        updateUI();
        setMessage(`Level ${level}: Reach ${targetScore} points!`);
    }

    function renderBoard() {
        const grid = document.getElementById('board-grid');
        grid.innerHTML = '';
        
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'cell';
                cellDiv.dataset.row = r;
                cellDiv.dataset.col = c;
                
                const piece = board[r][c];
                if (piece !== null) {
                    if (piece.special === 'drone') {
                        cellDiv.classList.add('special-drone');
                        cellDiv.innerText = '🚁';
                    } else if (piece.special === 'tnt') {
                        cellDiv.classList.add('special-tnt');
                        cellDiv.innerText = '💣';
                    } else if (piece.special === 'prism') {
                        cellDiv.classList.add('special-prism');
                        cellDiv.innerText = '💎';
                    } else {
                        cellDiv.classList.add(`piece-${piece.color}`);
                    }
                }

                cellDiv.addEventListener('pointerdown', (e) => startDrag(e, r, c));
                cellDiv.addEventListener('pointerenter', (e) => updateDrag(e, r, c));

                grid.appendChild(cellDiv);
            }
        }
        document.getElementById('score-display').innerText = `Score: ${score} / ${targetScore}`;
        document.getElementById('moves-display').innerText = `Moves: ${moves}`;
        document.getElementById('level-display').innerText = `Level: ${level}`;
    }

    window.addEventListener('pointerup', () => { dragStart = null; });

    function startDrag(e, r, c) {
        if (isProcessing || moves <= 0) return;
        dragStart = { r, c };
        e.target.classList.add('dragging');
    }

    function updateDrag(e, r, c) {
        if (!dragStart || isProcessing) return;
        let dr = Math.abs(dragStart.r - r);
        let dc = Math.abs(dragStart.c - c);
        
        if (dr + dc === 1) {
            let start = dragStart;
            dragStart = null;
            trySwapAndResolve(start.r, start.c, r, c);
        }
    }

    function trySwapAndResolve(r1, c1, r2, c2) {
        isProcessing = true;
        
        let temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;

        let matchGroups = detectAllMatches();
        let specialActivated = checkSpecialInteractions(r1, c1, r2, c2);

        if (matchGroups.length > 0 || specialActivated) {
            moves--;
            renderBoard();
            setTimeout(() => resolveBoardLoop(), 300);
        } else {
            temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
            isProcessing = false;
            renderBoard();
            setMessage("Invalid move!");
        }
    }

    function checkSpecialInteractions(r1, c1, r2, c2) {
        let p1 = board[r1][c1];
        let p2 = board[r2][c2];
        if (!p1 || !p2) return false;

        if (p1.special === 'prism' && p2.color !== null) {
            clearColor(p2.color);
            board[r1][c1] = null;
            score += 100;
            return true;
        }
        if (p2.special === 'prism' && p1.color !== null) {
            clearColor(p1.color);
            board[r2][c2] = null;
            score += 100;
            return true;
        }
        return false;
    }

    function clearColor(colorId) {
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] && board[r][c].color === colorId) {
                    board[r][c] = null;
                    score += 20;
                }
            }
        }
    }

    function detectAllMatches() {
        let matched = new Set();
        
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE - 2; c++) {
                let p1 = board[r][c];
                let p2 = board[r][c+1];
                let p3 = board[r][c+2];
                if (p1 && p2 && p3 && p1.color === p2.color && p2.color === p3.color && p1.special === null && p2.special === null && p3.special === null) {
                    matched.add(`${r},${c}`);
                    matched.add(`${r},${c+1}`);
                    matched.add(`${r},${c+2}`);
                }
            }
        }

        for (let c = 0; c < BOARD_SIZE; c++) {
            for (let r = 0; r < BOARD_SIZE - 2; r++) {
                let p1 = board[r][c];
                let p2 = board[r+1][c];
                let p3 = board[r+2][c];
                if (p1 && p2 && p3 && p1.color === p2.color && p2.color === p3.color && p1.special === null && p2.special === null && p3.special === null) {
                    matched.add(`${r},${c}`);
                    matched.add(`${r+1},${c}`);
                    matched.add(`${r+2},${c}`);
                }
            }
        }

        return Array.from(matched).map(coord => {
            let [r, c] = coord.split(',').map(Number);
            return { r, c };
        });
    }

    function resolveBoardLoop() {
        let matches = detectAllMatches();
        if (matches.length === 0) {
            isProcessing = false;
            checkGameProgress();
            return;
        }

        matches.forEach(m => {
            if (board[m.r][m.c]) {
                board[m.r][m.c] = null;
                score += 15;
            }
        });

        renderBoard();

        setTimeout(() => {
            applyGravityAndRefill();
            renderBoard();
            setTimeout(resolveBoardLoop, 300);
        }, 300);
    }

    function applyGravityAndRefill() {
        for (let c = 0; c < BOARD_SIZE; c++) {
            let writeRow = BOARD_SIZE - 1;
            for (let r = BOARD_SIZE - 1; r >= 0; r--) {
                if (board[r][c] !== null) {
                    board[writeRow][c] = board[r][c];
                    if (writeRow !== r) board[r][c] = null;
                    writeRow--;
                }
            }
            for (let r = writeRow; r >= 0; r--) {
                let specialRoll = Math.random();
                let special = null;
                if (specialRoll < 0.03) special = 'prism';
                else if (specialRoll < 0.08) special = 'tnt';
                else if (specialRoll < 0.15) special = 'drone';

                board[r][c] = { color: randomColor(), special: special };
            }
        }
    }

    function checkGameProgress() {
        if (score >= targetScore) {
            level++;
            targetScore += 500;
            moves += 15;
            setMessage(`🎉 Level Up! Welcome to Level ${level}!`);
            renderBoard();
        } else if (moves <= 0) {
            setMessage("❌ Out of Moves! Tap Restart.");
        } else {
            setMessage("Keep going! Reach target score.");
        }
    }

    function shuffleBoard() {
        let tiles = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                tiles.push(board[r][c]);
            }
        }
        tiles.sort(() => Math.random() - 0.5);
        let idx = 0;
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                board[r][c] = tiles[idx++];
            }
        }
        renderBoard();
        setMessage("Board shuffled!");
    }

    function setMessage(msg) {
        document.getElementById('status-msg').innerText = msg;
    }

    initGame();
</script>

</body>
</html>

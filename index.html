<script>
    const BOARD_SIZE = 8;
    const NUM_COLORS = 5;
    let board = [];
    let score = 0;
    let level = 1;
    let targetScore = 1000;
    let moves = 25;
    let isProcessing = false;
    let dragStart = null;

    function randomColor() {
        return Math.floor(Math.random() * NUM_COLORS);
    }

    function initGame() {
        score = 0;
        moves = 25;
        isProcessing = false;
        
        do {
            board = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                let row = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    row.push({ color: randomColor(), special: null });
                }
                board.push(row);
            }
        } while (detectAllMatches().length > 0);

        updateUI();
        setMessage(`Level ${level}: Reach ${targetScore} points!`);
    }

    function renderBoard() {
        const grid = document.getElementById('board-grid');
        grid.innerHTML = '';
        
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'cell';
                cellDiv.dataset.row = r;
                cellDiv.dataset.col = c;
                
                const piece = board[r][c];
                if (piece !== null) {
                    if (piece.special === 'drone') {
                        cellDiv.classList.add('special-drone');
                        cellDiv.innerText = '🚁';
                    } else if (piece.special === 'tnt') {
                        cellDiv.classList.add('special-tnt');
                        cellDiv.innerText = '💣';
                    } else if (piece.special === 'prism') {
                        cellDiv.classList.add('special-prism');
                        cellDiv.innerText = '💎';
                    } else {
                        cellDiv.classList.add(`piece-${piece.color}`);
                    }
                }

                cellDiv.addEventListener('pointerdown', (e) => startDrag(e, r, c));
                cellDiv.addEventListener('pointerenter', (e) => updateDrag(e, r, c));

                grid.appendChild(cellDiv);
            }
        }
        document.getElementById('score-display').innerText = `Score: ${score} / ${targetScore}`;
        document.getElementById('moves-display').innerText = `Moves: ${moves}`;
        document.getElementById('level-display').innerText = `Level: ${level}`;
    }

    window.addEventListener('pointerup', () => { dragStart = null; });

    function startDrag(e, r, c) {
        if (isProcessing || moves <= 0) return;
        dragStart = { r, c };
        e.target.classList.add('dragging');
    }

    function updateDrag(e, r, c) {
        if (!dragStart || isProcessing) return;
        let dr = Math.abs(dragStart.r - r);
        let dc = Math.abs(dragStart.c - c);
        
        if (dr + dc === 1) {
            let start = dragStart;
            dragStart = null;
            trySwapAndResolve(start.r, start.c, r, c);
        }
    }

    function trySwapAndResolve(r1, c1, r2, c2) {
        isProcessing = true;
        
        let temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;

        let matchGroups = detectAllMatches();
        let specialActivated = checkSpecialInteractions(r1, c1, r2, c2);

        if (matchGroups.length > 0 || specialActivated) {
            moves--;
            renderBoard();
            setTimeout(() => resolveBoardLoop(), 300);
        } else {
            temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
            isProcessing = false;
            renderBoard();
            setMessage("Invalid move!");
        }
    }

    function checkSpecialInteractions(r1, c1, r2, c2) {
        let p1 = board[r1][c1];
        let p2 = board[r2][c2];
        if (!p1 || !p2) return false;

        if (p1.special === 'prism' && p2.color !== null) {
            clearColor(p2.color);
            board[r1][c1] = null;
            score += 100;
            return true;
        }
        if (p2.special === 'prism' && p1.color !== null) {
            clearColor(p1.color);
            board[r2][c2] = null;
            score += 100;
            return true;
        }
        return false;
    }

    function clearColor(colorId) {
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] && board[r][c].color === colorId) {
                    board[r][c] = null;
                    score += 20;
                }
            }
        }
    }

    function detectAllMatches() {
        let matched = new Set();
        
        // Horizontal matches
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE - 2; c++) {
                let p1 = board[r][c];
                let p2 = board[r][c+1];
                let p3 = board[r][c+2];
                if (p1 && p2 && p3 && p1.color === p2.color && p2.color === p3.color && p1.special === null && p2.special === null && p3.special === null) {
                    matched.add(`${r},${c}`);
                    matched.add(`${r},${c+1}`);
                    matched.add(`${r},${c+2}`);
                }
            }
        }

        // Vertical matches
        for (let c = 0; c < BOARD_SIZE; c++) {
            for (let r = 0; r < BOARD_SIZE - 2; r++) {
                let p1 = board[r][c];
                let p2 = board[r+1][c];
                let p3 = board[r+2][c];
                if (p1 && p2 && p3 && p1.color === p2.color && p2.color === p3.color && p1.special === null && p2.special === null && p3.special === null) {
                    matched.add(`${r},${c}`);
                    matched.add(`${r+1},${c}`);
                    matched.add(`${r+2},${c}`);
                }
            }
        }

        return Array.from(matched).map(coord => {
            let [r, c] = coord.split(',').map(Number);
            return { r, c };
        });
    }

    function resolveBoardLoop() {
        let matches = detectAllMatches();
        if (matches.length === 0) {
            isProcessing = false;
            checkGameProgress();
            return;
        }

        matches.forEach(m => {
            if (board[m.r][m.c]) {
                board[m.r][m.c] = null;
                score += 15;
            }
        });

        renderBoard();

        setTimeout(() => {
            applyGravityAndRefill();
            renderBoard();
            setTimeout(resolveBoardLoop, 300);
        }, 300);
    }

    function applyGravityAndRefill() {
        for (let c = 0; c < BOARD_SIZE; c++) {
            let writeRow = BOARD_SIZE - 1;
            for (let r = BOARD_SIZE - 1; r >= 0; r--) {
                if (board[r][c] !== null) {
                    board[writeRow][c] = board[r][c];
                    if (writeRow !== r) board[r][c] = null;
                    writeRow--;
                }
            }
            for (let r = writeRow; r >= 0; r--) {
                let specialRoll = Math.random();
                let special = null;
                if (specialRoll < 0.03) special = 'prism';
                else if (specialRoll < 0.08) special = 'tnt';
                else if (specialRoll < 0.15) special = 'drone';

                board[r][c] = { color: randomColor(), special: special };
            }
        }
    }

    function checkGameProgress() {
        if (score >= targetScore) {
            level++;
            targetScore += 500;
            moves += 15;
            setMessage(`🎉 Level Up! Welcome to Level ${level}!`);
            renderBoard();
        } else if (moves <= 0) {
            setMessage("❌ Out of Moves! Tap Restart.");
        } else {
            setMessage("Keep going! Reach target score.");
        }
    }

    function shuffleBoard() {
        let tiles = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                tiles.push(board[r][c]);
            }
        }
        tiles.sort(() => Math.random() - 0.5);
        let idx = 0;
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                board[r][c] = tiles[idx++];
            }
        }
        renderBoard();
        setMessage("Board shuffled!");
    }

    function setMessage(msg) {
        document.getElementById('status-msg').innerText = msg;
    }

    initGame();
</script>
